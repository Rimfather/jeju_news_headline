<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제주 지방신문 TOP 10</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <!-- 상단 헤더 -->
    <header class="bg-white shadow-sm sticky top-0 z-10">
        <div class="max-w-3xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-emerald-600">📰 제주 지방신문 TOP 10</h1>
            <span class="text-xs text-gray-500">실시간 주요 기사 모음</span>
        </div>
    </header>

    <!-- 메인 컨테이너 -->
    <main class="max-w-3xl mx-auto px-4 py-6 flex-1 w-full">
        
        <!-- 신문사 선택 탭 -->
        <div class="flex rounded-lg bg-gray-200 p-1 mb-6">
            <button onclick="switchTab('jeju')" id="tab-jeju" class="flex-1 py-2.5 text-sm font-semibold rounded-md transition-all bg-white text-emerald-600 shadow-sm">제주일보</button>
            <button onclick="switchTab('halla')" id="tab-halla" class="flex-1 py-2.5 text-sm font-semibold rounded-md transition-all text-gray-600 hover:text-gray-900">한라일보</button>
            <button onclick="switchTab('jemin')" id="tab-jemin" class="flex-1 py-2.5 text-sm font-semibold rounded-md transition-all text-gray-600 hover:text-gray-900">제민일보</button>
        </div>

        <!-- 뉴스 리스트 영역 -->
        <div id="news-container" class="space-y-3">
            <!-- 자바스크립트로 동적 생성됩니다 -->
        </div>
    </main>

    <!-- 푸터 -->
    <footer class="bg-white border-t border-gray-200 py-4 text-center text-xs text-gray-400">
        <p>© 2026 제주 지방신문 TOP 10. 추후 앱으로 확장될 예정입니다.</p>
    </footer>

    <script>
        function switchTab(company) {
            ['jeju', 'halla', 'jemin'].forEach(c => {
                const btn = document.getElementById(`tab-${c}`);
                if (c === company) {
                    btn.className = "flex-1 py-2.5 text-sm font-semibold rounded-md transition-all bg-white text-emerald-600 shadow-sm";
                } else {
                    btn.className = "flex-1 py-2.5 text-sm font-semibold rounded-md transition-all text-gray-600 hover:text-gray-900";
                }
            });
            fetchNews(company);
        }

        async function fetchNews(company) {
            const container = document.getElementById('news-container');
            container.innerHTML = '<p class="text-center text-gray-400 py-10">기사를 불러오는 중입니다...</p>';

            try {
                const response = await fetch(`https://jeju-news-headline.onrender.com/api/news/${company}`);
                const data = await response.json();
                const articles = data.articles;

                let html = '';
                articles.forEach((item, index) => {
                    html += `
                        <a href="${item.link}" target="_blank" class="block bg-white p-4 rounded-lg border border-gray-100 shadow-sm hover:shadow-md hover:border-emerald-200 transition-all group">
                            <div class="flex items-start justify-between gap-3">
                                <span class="flex-shrink-0 w-6 h-6 bg-emerald-50 text-emerald-600 text-xs font-bold rounded-full flex items-center justify-center mt-0.5">${index + 1}</span>
                                <div class="flex-1">
                                    <h2 class="text-sm md:text-base font-medium text-gray-800 group-hover:text-emerald-600 transition-colors">${item.title}</h2>
                                    <span class="text-xs text-gray-400 mt-1 inline-block">📅 ${item.time}</span>
                                </div>
                            </div>
                        </a>
                    `;
                });
                container.innerHTML = html;
            } catch (error) {
                container.innerHTML = '<p class="text-center text-red-500 py-10">서버 연결에 실패했습니다. 백엔드 서버를 확인해주세요!</p>';
            }
        }

        fetchNews('jeju');
    </script>
</body>
</html>
